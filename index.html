<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Workout Tracker</title>
<style>
  :root {
    --bg: #0f1216; --card: #181c22; --card2: #222831; --text: #e9edf2; --muted: #8b95a3;
    --line: #2a313b; --accent: #4f8cff; --good: #3ecf8e; --danger: #ff5d5d; --warn: #f5c542;
    --p1: #4f8cff; --p2: #f5a524; --p3: #b76cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(80px + env(safe-area-inset-bottom)); }
  h2 { font-size: 17px; margin: 0 0 10px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .muted { color: var(--muted); }
  small { font-size: 13px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pc, var(--muted)); font-weight: 700; }
  .tag { font-size: 12px; background: var(--card2); color: var(--muted); padding: 3px 8px; border-radius: 99px; vertical-align: middle; font-weight: 600; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .btn { border: 1px solid var(--line); background: var(--card2); border-radius: 14px; padding: 12px 16px; font-weight: 600; }
  .btn.primary { background: var(--pc, var(--accent)); border-color: transparent; color: #fff; }
  .btn.big { width: 100%; padding: 16px; font-size: 18px; margin-top: 0; }
  .btn.danger { color: var(--danger); background: transparent; }
  .btn.block { width: 100%; margin-top: 10px; }

  ul.ex { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.ex li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  ul.ex li:last-child { border-bottom: 0; }
  ul.ex li[data-act] { cursor: pointer; border-radius: 10px; }
  ul.ex li[data-act]:active { background: var(--card2); }
  ul.ex .reps { min-width: 44px; text-align: center; font-weight: 800; font-size: 18px; background: var(--card2); border-radius: 10px; padding: 4px 6px; }
  ul.ex .name { flex: 1; }
  ul.ex .kg { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* looks like the plain kg text until tapped */
  .kgin { display: flex; align-items: center; gap: 3px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kgin input { width: 3em; font: inherit; text-align: right; padding: 2px 3px; border-radius: 8px;
    border: 1px solid transparent; background: transparent; color: var(--muted); outline: none; }
  .kgin input::placeholder { color: var(--muted); }
  .kgin input:focus { background: var(--card2); border-color: var(--accent); color: var(--text); text-align: center; }
  .kgin input.miss { color: var(--warn); }
  .up { color: var(--good); font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
  .sub { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 16px; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-block; transition: transform .2s; color: var(--muted); }
  details[open] .chev { transform: rotate(90deg); }

  /* timer */
  .tcard { position: relative; }
  .twrap { display: flex; justify-content: center; }
  .ring { position: relative; width: min(60vw, 250px); aspect-ratio: 1; flex: none; cursor: pointer; user-select: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--card2); }
  .ring .bar { stroke: var(--pc); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #t-time { font-size: 60px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  #t-time.paused { opacity: .45; }
  #t-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .dots { display: flex; gap: 6px; margin-top: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--card2); border: 2px solid var(--line); }
  .dot.done { background: var(--good); border-color: var(--good); }
  .dot.cur { border-color: var(--pc); }
  .tools { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  .tools.left { right: auto; left: 10px; }
  .ttotal { position: absolute; top: 12px; left: 14px; display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ttotal svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .ibr { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card2);
    font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .ibr svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  ul.ex input.reps { width: 56px; min-width: 56px; font: inherit; font-weight: 800; font-size: 18px; color: var(--text);
    border: 1px solid var(--line); outline: none; }
  ul.ex input.reps:focus { border-color: var(--accent); }
  ul.ex input.reps.miss { border-color: var(--warn); color: var(--warn); }
  ul.ex input.reps::placeholder { color: var(--text); opacity: 1; }
  /* hide number spinners so the value stays centered */
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* extra rounds (program 3) */
  .xsum { font-size: 14px; color: var(--muted); margin-top: 10px; }
  #x-dots { margin: 0; }
  #x-dots .dot { width: 14px; height: 14px; }
  .tlabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pc); margin-bottom: 4px;
    pointer-events: none; }
  .ibr.mark.on { background: var(--good); border-color: var(--good); color: #fff; }

  /* calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-h { text-align: center; font-size: 11px; color: var(--muted); }
  .cal-d { position: relative; aspect-ratio: 1; border-radius: 9px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .cal-d.hit { color: #fff; font-weight: 700; }
  .cal-d.fut { opacity: .3; }
  .cal-d.today { outline: 2px solid var(--text); outline-offset: -2px; }
  .xd { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 2px; }
  .xd i, .legend i.xdl { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 1.5px var(--card); }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* progress charts */
  .segs { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg { flex: 1; border: 1px solid var(--line); background: var(--card2); border-radius: 12px; padding: 9px 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg.on { background: var(--pc, var(--accent)); border-color: transparent; color: #fff; }
  .chips { display: flex; gap: 6px; }
  .chips .chip { flex: 1; }
  .chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .chip.on { background: var(--card2); color: var(--text); border-color: var(--muted); }
  .ch { padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
  .ch:last-child { border-bottom: 0; }
  .chh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cv { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 2px 0 4px; min-height: 1.4em; }
  svg.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.chart .tk { stroke: var(--muted); stroke-width: 1; opacity: .5; }
  svg.chart .ax { fill: var(--muted); font-size: 10px; font-family: inherit; }
  svg.chart .ln { fill: none; stroke: var(--pc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .mk { fill: var(--pc); stroke: var(--card); stroke-width: 2; }
  svg.chart .mk.kup { fill: var(--good); }
  svg.chart .mk.kdown { fill: var(--danger); }
  .klegend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .klegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  svg.chart .xh { stroke: var(--muted); stroke-width: 1; }
  svg.chart .hl { fill: var(--pc); stroke: var(--text); stroke-width: 2; }

  /* settings */
  .erow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .erow:last-child { border-bottom: 0; }
  .ename { background: none; border: 0; padding: 0 0 8px; text-align: left; font-weight: 600; }
  .steppers { display: flex; gap: 10px; flex-wrap: wrap; }
  .stp { display: flex; align-items: center; background: var(--card2); border-radius: 12px; overflow: hidden; }
  .stp button { width: 44px; height: 42px; border: 0; background: none; font-size: 22px; color: var(--accent); }
  .stp span { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stp small { color: var(--muted); font-weight: 500; margin-left: 3px; }
  .tgl { flex: none; width: 52px; height: 30px; border-radius: 99px; border: 0; background: var(--line); padding: 3px; position: relative; transition: background .2s; }
  .tgl i { display: block; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: transform .2s; }
  .tgl.on { background: var(--good); }
  .tgl.on i { transform: translateX(22px); }
  .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .nmrow { display: flex; gap: 6px; margin-bottom: 8px; }
  .nmrow .nm { margin-bottom: 0; flex: 1; min-width: 0; }
  .ib { width: 40px; flex: none; border: 1px solid var(--line); background: var(--card2); border-radius: 10px; font-size: 16px; }
  .ib:disabled { opacity: .3; }
  .ib.del { color: var(--danger); }
  .nm { width: 100%; font: inherit; font-weight: 600; padding: 9px 12px; margin-bottom: 8px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--card2); color: var(--text); }

  /* history */
  .hist { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .hist:last-child { border-bottom: 0; }
  .hist .pill { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex: none; }
  .hist .body { font-size: 14px; color: var(--muted); padding: 8px 0 0 18px; }
  .hist .del { background: none; border: 0; color: var(--danger); padding: 8px 0 0 18px; font-size: 14px; }
  .hist .edit { background: none; border: 0; color: var(--accent); padding: 8px 0 0 18px; font-size: 14px; font-weight: 600; }
  .hist summary { display: flex; align-items: center; }
  .hist summary .when { flex: 1; min-width: 0; }
  .hist .miss { color: var(--warn); }
  .hist .xtra { color: var(--good); }
  .chg { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .chg.up { color: var(--good); background: rgba(62,207,142,.14); }
  .chg.same { color: var(--muted); background: var(--card2); }
  .chg.down { color: var(--warn); background: rgba(245,197,66,.14); }
  .he { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .he input { width: 64px; font: inherit; text-align: center; padding: 6px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card2); color: var(--text); }

  /* tab bar fixed to the bottom of the screen */
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: rgba(15,18,22,.96);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
  .bnav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 9px 0 11px; font-size: 12px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bnav button.on { color: var(--accent); }
  .bnav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* focus mode: only the timer, as big as the screen allows */
  .fbtn { position: absolute; top: 10px; right: 10px; }
  body.focus #view-today > :not(.tcard), body.focus .bnav { display: none; }
  body.focus main { padding-bottom: 16px; }
  body.focus .tcard { margin: 0; min-height: calc(100dvh - 32px); display: flex; align-items: center; justify-content: center; }
  body.focus .ring { width: min(80vw, 66dvh, 560px); }
  body.focus #t-time { font-size: min(22vw, 14dvh, 140px); }
  body.focus #t-sub { font-size: 16px; }
  body.focus .dots { gap: 10px; margin-top: 14px; }
  body.focus .dot { width: 16px; height: 16px; }
  body.focus .ttotal { font-size: 16px; }
  body.focus .ttotal svg { width: 17px; height: 17px; }
  body.focus .ibr { width: 48px; height: 48px; font-size: 15px; }
  body.focus .ibr svg { width: 20px; height: 20px; }
  body.focus .tools { gap: 12px; bottom: 14px; }

  .cal-d[data-act] { cursor: pointer; }
  .pop { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .pop[hidden] { display: none; }
  .pop-card { width: 100%; max-width: 528px; max-height: 80vh; overflow-y: auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: 16px; cursor: default; }
  .pop-card .hist .body { padding-left: 18px; }

  #toast { position: fixed; z-index: 6; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; opacity: 0;
    transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main id="view-today"></main>
<main id="view-stats" hidden></main>
<main id="view-settings" hidden></main>

<nav class="bnav">
  <button data-act="tab" data-t="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Today</button>
  <button data-act="tab" data-t="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-act="tab" data-t="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="pop" class="pop" data-act="closePop" hidden><div id="pop-card" class="pop-card" data-act="noop"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
const KEY = 'wt-state-v1';
const roundMs = () => (S.roundMin || 6) * 60 * 1000;
const TARGET = 4;
const EXTRA_MAX = 3;
const MAIN = ['p1', 'p2'];
const VIEWS = ['today', 'stats', 'settings'];

const uid = () => Math.random().toString(36).slice(2, 10);
const ex = (name, reps, kg = 0) => ({ id: uid(), name, reps, kg });

function defaultState() {
  return {
    v: 3,
    nextMain: 'p1',
    programs: {
      p1: { name: 'Program 1', nextUp: 0,
        exercises: [ex('Bench press', 12, 50), ex('Chin ups', 10), ex('Tricep curl', 12, 15), ex('Bicep curl', 12, 15), ex('Tricep pull', 12)],
        buyout: [ex('Bicep curl', 0, 10), ex('Tricep pull', 0)] },
      p2: { name: 'Program 2', nextUp: 0,
        exercises: [ex('Deadlift', 12, 50), ex('Pull ups', 7), ex('Ab roll out', 12), ex('Back pull', 16), ex('Crunches', 16)],
        buyout: [ex('Crunches', 0), ex('Placeholder', 0)] },
      p3: { name: 'Program 3', nextUp: 0,
        exercises: [ex('Calf raises', 16, 15), ex('Shoulder tug', 12), ex('Shoulder press', 12, 15), ex('Placeholder', 12), ex('Placeholder', 12)],
        buyout: [] },
    },
    history: [],
    active: null,
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.programs) return migrate(s);
  } catch (e) {}
  return defaultState();
}
function migrate(s) {
  if ((s.v || 1) < 2) { s.programs.p3.exercises.push(ex('Placeholder', 12)); s.v = 2; }
  if (s.v < 3) {
    const { p2, p3 } = s.programs;
    if (!p2.buyout.some(b => b.name === 'Placeholder')) p2.buyout.push(ex('Placeholder', 0));
    // only rework program 3 if it's still the original list (don't overwrite own edits);
    // calf raises, shoulder press and the placeholder keep their history
    const names = p3.exercises.map(e => e.name).join('|');
    if (names === 'Calf raises|Shoulder raises|Calf raises, 1 foot|Shoulder press|Placeholder') {
      const [calf, , , press, ph] = p3.exercises;
      keepNext(p3, () => { p3.exercises = [calf, ex('Shoulder tug', 12), press, ph, ex('Placeholder', 12)]; });
    }
    s.v = 3;
  }
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

let S = load();
let tab = (() => { try { const t = localStorage.getItem('wt-tab'); return VIEWS.includes(t) ? t : 'today'; } catch (e) { return 'today'; } })();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const t = Math.floor(ms / 1000); return `${Math.floor(t / 60)}:${pad(t % 60)}`; };
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${pad(m % 60)} min` : `${m} min`; };
const kgTxt = kg => kg ? `${+kg} kg` : '';
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dShort = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const other = p => p === 'p1' ? 'p2' : 'p1';
// match a logged exercise to a program exercise; older logs have no id, so fall back to the name
const same = (x, e) => x && (x.id ? x.id === e.id : x.name === e.name);

let editing = null;                    // program id whose exercises are being edited
let progP = 'p1', progRange = 14;      // stats chart filters (range in days, 0 = all; 2 weeks by default)
let editHist = null, openHist = null;  // history entry being edited / kept open
let xOpen = false;                     // program 3 card on the Today tab: folded unless opened (or in use)
let focus = (() => { try { return localStorage.getItem('wt-focus') === '1'; } catch (e) { return false; } })();

function dateTxt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' +
    d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3000);
}

// ---------- workout state ----------
// There is always a workout ready on the Today tab; it only starts counting on the first tap.
const newActive = pid => ({ program: pid, startedAt: Date.now(), acc: 0, runSince: null, firstStart: null,
  lastDone: 0, buyout: {}, done: {}, kg: {}, extra: 0 });
function ensureActive() {
  if (!S.active) { S.active = newActive(S.nextMain); save(); }
  return S.active;
}

// ---------- timer ----------
// Two timers share the big clock: the main program's (its fields live on the workout itself)
// and the program 3 extra's (a.xt). Both have acc/runSince/lastDone/marked; a.mode says which is shown.
const extraMs = () => (S.extraMin || 3) * 60 * 1000;
const newTimer = () => ({ acc: 0, runSince: null, lastDone: 0, marked: 0 });
function timers(a) {
  a.xt = a.xt || newTimer();
  return {
    main: { t: a, len: roundMs(), target: TARGET, pc: a.program, label: '' },
    extra: { t: a.xt, len: extraMs(), target: EXTRA_MAX, pc: 'p3', label: S.programs.p3.name },
  };
}
const cur = a => timers(a)[a.mode === 'extra' ? 'extra' : 'main'];
const elapsed = t => t.acc + (t.runSince ? Date.now() - t.runSince : 0);
// rounds finished: by the clock, or marked done early with ✓ (the clock still runs to the limit)
const roundsDone = (t, len) => Math.max(Math.floor(elapsed(t) / len), t.marked || 0);
const extraRounds = a => Math.min(EXTRA_MAX, Math.max(a.extra || 0, a.xt ? roundsDone(a.xt, extraMs()) : 0));
// total workout time is plain wall-clock time since the first tap on a timer:
// pausing and the +/- buttons don't affect it
// (workouts started before this existed have no firstStart field: fall back to startedAt)
const firstStart = a => 'firstStart' in a ? a.firstStart : a.startedAt;
const totalTime = a => firstStart(a) ? Date.now() - firstStart(a) : 0;
function setElapsed(t, ms, len) {
  t.acc = Math.max(0, ms);
  if (t.runSince) t.runSince = Date.now();
  t.lastDone = Math.floor(t.acc / len);
  t.marked = Math.min(t.marked || 0, t.lastDone + 1); // stepping back un-marks rounds
}

let audio;
function ensureAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
}
// vibration is off unless turned on in settings
function vibrate(pattern) { if (S.vibrate && navigator.vibrate) navigator.vibrate(pattern); }
function beep(freq = 880, dur = 0.15) {
  if (!audio || !S.sound) return; // sound is off unless turned on in settings
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.3, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}
function roundAlert(done, target, which) {
  const final = done === target;
  beep(final ? 1320 : 1046, final ? 0.8 : 0.5);
  vibrate(final ? [400, 150, 400, 150, 400] : [400, 150, 400]);
  if (final) toast(which === 'extra' ? `${S.programs.p3.name}: ${target} rounds done!` : `${target} rounds done! Time for the buy-out 💪`);
}

let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && anyRunning() && !wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
// keep the screen on while the main timer or the extra timer is running
const anyRunning = () => !!(S.active && (S.active.runSince || (S.active.xt && S.active.xt.runSince)));
function syncAwake() { if (anyRunning()) keepAwake(); else releaseAwake(); }
document.addEventListener('visibilitychange', keepAwake);

const dotsHtml = (n, done) => Array.from({ length: n }, (_, i) =>
  `<div class="dot ${i < done ? 'done' : i === done ? 'cur' : ''}"></div>`).join('');

const countdown = {}; // last countdown second beeped, per timer
function tick() {
  const a = S.active;
  if (!a) return;
  // alarms for both timers, whichever one is on screen
  for (const [which, { t, len, target }] of Object.entries(timers(a))) {
    const e = elapsed(t), done = Math.floor(e / len), left = Math.ceil((len - e % len) / 1000);
    if (done > (t.lastDone || 0)) { t.lastDone = done; save(); roundAlert(done, target, which); }
    if (t.runSince && left <= 3 && left !== countdown[which]) { countdown[which] = left; beep(660, 0.1); }
    if (left > 3) countdown[which] = null;
  }

  const time = $('#t-time');
  if (!time) return;
  const { t, len, target } = cur(a);
  const e = elapsed(t), within = e % len, done = roundsDone(t, len);
  const started = t === a ? firstStart(a) : t.started;
  time.textContent = fmt(within);
  $('#t-total').textContent = fmt(totalTime(a));
  time.classList.toggle('paused', !t.runSince);
  const bar = $('#t-bar'), C = 2 * Math.PI * 45;
  bar.style.strokeDasharray = C;
  bar.style.strokeDashoffset = C * (1 - within / len);
  $('#t-dots').innerHTML = dotsHtml(target, done);
  $('#t-sub').textContent = t.runSince ? '' : started ? 'Paused' : 'Tap to start';
  $('#t-mark').classList.toggle('on', (t.marked || 0) > Math.floor(e / len));
  const xd = $('#x-dots');
  if (xd) {
    const xr = extraRounds(a);
    xd.innerHTML = dotsHtml(EXTRA_MAX, xr);
    $('#x-status').textContent = `${xr} of ${EXTRA_MAX} rounds`;
  }
}
setInterval(tick, 250);

// ---------- progression ----------
function progress(p) {
  const list = p.exercises;
  if (!list.length) return null;
  const i = (p.nextUp || 0) % list.length;
  const e = list[i];
  const from = e.reps;
  e.reps += 1;
  p.nextUp = (i + 1) % list.length;
  return { name: e.name, from, to: e.reps };
}

// run a change to a program's exercise list while keeping "+1 next" on the same exercise
function keepNext(p, change) {
  const cur = p.exercises[(p.nextUp || 0) % (p.exercises.length || 1)];
  change();
  const j = cur ? p.exercises.findIndex(e => e.id === cur.id) : -1;
  p.nextUp = j >= 0 ? j : 0;
}

// ---------- render: today ----------
// kg as text, or during a workout an input for the kg actually used
function kgCell(e, active) {
  if (!active) return `<span class="kg">${kgTxt(e.kg)}</span>`;
  const v = (active.kg || {})[e.id] ?? (e.kg || '');
  return `<span class="kgin"><input type="number" inputmode="decimal" min="0" step="0.5" placeholder="–" data-kgdone="${e.id}" data-target="${e.kg || 0}" value="${esc(v)}"${v !== '' && +v < (e.kg || 0) ? ' class="miss"' : ''} aria-label="kg used">kg</span>`;
}

// pid given → rows are tappable to pick which exercise gets +1 rep after the workout.
// active given → rep boxes become inputs for the reps actually done.
function exList(p, pid, active) {
  const n = (p.nextUp || 0) % (p.exercises.length || 1);
  let h = `<ul class="ex">` + p.exercises.map((e, i) => {
    const next = pid && i === n;
    let box = `<span class="reps">${e.reps}</span>`;
    if (active) {
      const v = (active.done || {})[e.id] ?? e.reps;
      box = `<input class="reps${+v < e.reps ? ' miss' : ''}" type="number" inputmode="numeric" min="0" data-done="${e.id}" data-target="${e.reps}" value="${esc(v)}" aria-label="Reps done">`;
    }
    return `<li${pid ? ` data-act="setNext" data-p="${pid}" data-i="${i}"` : ''}>${box}<span class="name">${esc(e.name)}${next ? '<span class="up">↑ +1 next</span>' : ''}</span>${kgCell(e, active)}</li>`;
  }).join('') + `</ul>`;
  if (p.buyout.length) {
    h += `<div class="sub">Buy-out</div><ul class="ex">` + p.buyout.map(b => {
      const box = active
        ? `<input class="reps" type="number" inputmode="numeric" min="0" placeholder="max" data-bo="${b.id}" value="${esc(active.buyout[b.id] ?? '')}">`
        : `<span class="reps">max</span>`;
      return `<li>${box}<span class="name">${esc(b.name)}</span>${kgCell(b, active)}</li>`;
    }).join('') + `</ul>`;
  }
  return h;
}

      <button class="ibr fbtn" data-act="focus" aria-label="${focus ? 'Leave focus mode' : 'Focus mode'}"><svg viewBox="0 0 24 24">${focus
        ? '<path d="M9 4v5H4M15 4v5h5M15 20v-5h5M9 20v-5H4"/>'
        : '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>'}</svg></button>
      <div class="twrap">

        <div class="tools left">

          <button class="ibr" data-act="nudge" data-d="15000" aria-label="Add 15 seconds">+15</button>

// ---------- render: stats ----------
// sessions that contain a program's exercises; program 3 is logged as "extra" on a program 1/2 workout
function sessionsFor(pid) {
  return S.history.flatMap(h => {
    if (pid === 'p3') {
      if (h.program === 'p3') return [h]; // standalone program 3 workouts from older versions
      return h.extra && h.extra.rounds ? [{ date: h.date, exercises: h.extra.exercises, buyout: [] }] : [];
    }
    return h.program === pid ? [h] : [];
  });
}

function calendar() {
  const byDay = {};
  S.history.forEach(h => {
    const d = byDay[dayKey(new Date(h.date))] = byDay[dayKey(new Date(h.date))] || { ps: [], extra: 0 };
    if (h.program === 'p3') d.extra = Math.max(d.extra, Math.min(EXTRA_MAX, h.rounds || 1));
    else d.ps.push(h.program);
    if (h.extra) d.extra = Math.max(d.extra, h.extra.rounds);
  });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(today.getDate() - ((today.getDay() + 6) % 7) - 28);
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="cal-h">${d}</div>`).join('');
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const day = byDay[dayKey(d)] || { ps: [], extra: 0 };
    const ps = day.ps;
    const bg = ps.length === 0 ? '' : ps.length === 1 ? `var(--${ps[0]})`
      : `linear-gradient(135deg, var(--${ps[0]}) 50%, var(--${ps[1]}) 50%)`;
    const dots = day.extra ? `<span class="xd">${'<i></i>'.repeat(day.extra)}</span>` : '';
    const any = ps.length || day.extra;
    cells += `<div class="cal-d${ps.length ? ' hit' : ''}${d > today ? ' fut' : ''}${+d === +today ? ' today' : ''}"${bg ? ` style="background:${bg}"` : ''}${any ? ` data-act="day" data-k="${dayKey(d)}" role="button"` : ''}>${d.getDate()}${dots}</div>`;
  }
  return `<div class="cal">${cells}</div>
    <div class="legend">${MAIN.map(k => `<span><i style="background:var(--${k})"></i>${esc(S.programs[k].name)}</span>`).join('')}
      <span><i class="xdl"></i>${esc(S.programs.p3.name)} rounds</span></div>`;
}

// kg decides first; reps only count when the kg is unchanged. 1 = up, -1 = down, 0 = same
const direction = (dKg, dReps) => Math.sign(dKg) || Math.sign(dReps);
function changeText(dKg, dReps) {
  const sign = v => (v > 0 ? '+' : '') + v;
  return [dKg && `${sign(dKg)} kg`, dReps && `${sign(dReps)} rep${Math.abs(dReps) === 1 ? '' : 's'}`].filter(Boolean).join(' · ');
}
function badge(dKg, dReps) {
  const dir = direction(dKg, dReps);
  return `<span class="chg ${dir > 0 ? 'up' : dir < 0 ? 'down' : 'same'}">${changeText(dKg, dReps) || 'same'}</span>`;
}

// one line chart per exercise: reps over time. The x axis has a slot for every day in the range
// (start0 = midnight of the first day, nDays slots), so points land on the day they were done.
const charts = {}; // chart key → points, for the tap/hover readout
function chart(key, item, pts, start0, nDays) {
  const val = x => `${x.reps} reps${x.kg ? ` · ${+x.kg} kg` : ''}`;
  if (!pts.length) return `<div class="ch"><div class="chh"><b>${esc(item.name)}</b></div><div class="cv">No data in this period</div></div>`;
  const W = 320, H = 96, L = 26, R = 10, T = 8, B = 22;
  let lo = Math.min(...pts.map(p => p.reps)), hi = Math.max(...pts.map(p => p.reps));
  if (lo === hi) { lo -= 1; hi += 1; }
  const X = idx => L + (idx + 0.5) / nDays * (W - R - L);
  const Y = v => T + (hi - v) / (hi - lo) * (H - B - T);
  const xy = pts.map(p => [+X(p.day).toFixed(1), +Y(p.reps).toFixed(1)]);
  const ticks = nDays <= 31 ? Array.from({ length: nDays }, (_, i) =>
    `<line class="tk" x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${H - B + 3}" y2="${H - B + 6}"/>`).join('') : '';
  // the line follows the reps; a point is green/red when the kg went up/down since the previous workout
  const kgStep = pts.map((p, i) => i ? Math.round((p.kg - pts[i - 1].kg) * 100) / 100 : 0);
  charts[key] = pts.map((p, i) => ({ x: xy[i][0], y: xy[i][1],
    text: `${dShort(p.t)}: ${val(p)}${kgStep[i] ? ` (${kgStep[i] > 0 ? '+' : ''}${kgStep[i]} kg)` : ''}` }));
  const marker = (p, i) => {
    const cls = kgStep[i] > 0 ? ' kup' : kgStep[i] < 0 ? ' kdown' : '';
    if (!cls && pts.length > 40) return ''; // too many points for plain markers; kg changes always show
    return `<circle class="mk${cls}" cx="${p[0]}" cy="${p[1]}" r="${cls ? 5 : 4}"/>`;
  };
  const first = pts[0], last = pts[pts.length - 1];
  const change = pts.length > 1 ? badge(Math.round((last.kg - first.kg) * 100) / 100, last.reps - first.reps) : '';
  return `<div class="ch">
    <div class="chh"><b>${esc(item.name)}</b>${change}</div>
    <div class="cv" id="cv-${key}" data-def="${esc(val(last))}">${esc(val(last))}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" data-key="${key}" role="img" aria-label="${esc(item.name)}: reps over time, latest ${esc(val(last))}">
      <line class="grid" x1="${L}" x2="${W - R}" y1="${Y(hi)}" y2="${Y(hi)}"/>
      <line class="grid" x1="${L}" x2="${W - R}" y1="${Y(lo)}" y2="${Y(lo)}"/>
      <text class="ax" x="${L - 6}" y="${Y(hi) + 3.5}" text-anchor="end">${hi}</text>
      <text class="ax" x="${L - 6}" y="${Y(lo) + 3.5}" text-anchor="end">${lo}</text>
      ${ticks}
      <text class="ax" x="${L}" y="${H - 4}">${dShort(start0)}</text>
      ${nDays > 1 ? `<text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">today</text>` : ''}
      <polyline class="ln" points="${xy.map(p => p.join(',')).join(' ')}"/>
      ${xy.map(marker).join('')}
      <line class="xh" x1="-20" x2="-20" y1="${T}" y2="${H - B}"/>
      <circle class="hl" cx="-20" cy="-20" r="5"/>
    </svg>
  </div>`;
}

function progressCard() {
  const p = S.programs[progP];
  const midnight = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return +d; };
  const dayIdx = (t, from) => Math.round((midnight(t) - from) / 86400000); // round: DST days aren't 24 h
  const all = sessionsFor(progP);
  const today0 = midnight(Date.now());
  const start0 = progRange ? today0 - (progRange - 1) * 86400000
    : all.length ? midnight(Math.min(...all.map(s => +new Date(s.date)))) : today0;
  const nDays = dayIdx(today0, start0) + 1;
  const ss = all.filter(s => +new Date(s.date) >= start0);
  // one point per day (the last workout that day)
  const series = (item, kind) => {
    const byDay = new Map();
    ss.forEach(s => {
      const x = (s[kind] || []).find(y => same(y, item));
      if (x && x.reps != null) byDay.set(dayIdx(s.date, start0), { t: +new Date(s.date), reps: x.reps, kg: +x.kg || 0 });
    });
    return [...byDay].sort((a, b) => a[0] - b[0]).map(([day, p]) => ({ ...p, day }));
  };
  const segs = ['p1', 'p2', 'p3'].map(k =>
    `<button class="seg${k === progP ? ' on' : ''}" style="--pc:var(--${k})" data-act="progP" data-p="${k}">${esc(S.programs[k].name)}</button>`).join('');
  const chips = [[7, '1W'], [14, '2W'], [30, '1M'], [90, '3M'], [0, 'All']].map(([d, l]) =>
    `<button class="chip${d === progRange ? ' on' : ''}" data-act="progRange" data-d="${d}">${l}</button>`).join('');
  return `
    <section class="card" style="--pc:var(--${progP})">
      <h2>Progress</h2>
      <div class="segs">${segs}</div>
      <div class="chips">${chips}</div>
      <div class="klegend"><span><i style="background:var(--good)"></i>kg went up</span><span><i style="background:var(--danger)"></i>kg went down</span></div>
      ${p.exercises.map((e, i) => chart(`${progP}-e${i}`, e, series(e, 'exercises'), start0, nDays)).join('')}
      ${p.buyout.length ? `<div class="sub">Buy-out</div>` + p.buyout.map((b, i) => chart(`${progP}-b${i}`, b, series(b, 'buyout'), start0, nDays)).join('') : ''}
    </section>`;
}

// compare a workout with the previous one of the same program: green up, grey same, yellow down
function changeBadge(h, idx) {
  let prev = null;
  for (let j = idx - 1; j >= 0; j--) if (S.history[j].program === h.program) { prev = S.history[j]; break; }
  if (!prev) return '';
  const sum = (s, f) => s.exercises.reduce((t, e) => t + (+e[f] || 0), 0);
  return badge(Math.round((sum(h, 'kg') - sum(prev, 'kg')) * 100) / 100, sum(h, 'reps') - sum(prev, 'reps'));
}

// what was done in one workout (history details and the calendar pop-up)
function sessionBody(h) {
  const x = h.extra;
  return `${h.rounds} rounds · ${fmtDur(h.durationMs)}
    ${h.progressed ? `<br>↑ ${esc(h.progressed.name)}: ${h.progressed.from} → ${h.progressed.to} reps` : ''}
    <br>${h.exercises.map(e => {
      const miss = e.target && e.reps < e.target;
      return `<span${miss ? ' class="miss"' : ''}>${e.reps ?? '–'}${miss ? `/${e.target}` : ''}× ${esc(e.name)}</span>${e.kg ? ` (${+e.kg} kg)` : ''}`;
    }).join('<br>')}
    ${(h.buyout || []).length ? `<br>Buy-out: ${h.buyout.map(b => `${esc(b.name)} ${b.reps ?? '–'} reps`).join(', ')}` : ''}
    ${x ? `<br><span class="xtra">●</span> ${esc(S.programs.p3.name)}: ${x.rounds} of ${EXTRA_MAX} rounds${x.progressed ? ` · ↑ ${esc(x.progressed.name)} ${x.progressed.from} → ${x.progressed.to}` : ''}` : ''}`;
}

function openDay(key) {
  const list = S.history.map((h, idx) => [h, idx]).filter(([h]) => dayKey(new Date(h.date)) === key);
  if (!list.length) return;
  const d = new Date(list[0][0].date);
  $('#pop-card').innerHTML = `
    <div class="row"><h2 style="margin:0">${d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
      <button class="ibr" data-act="closePop" aria-label="Close">✕</button></div>
    ${list.map(([h, idx]) => `
      <div class="hist">
        <div class="row"><span><span class="pill" style="background:var(--${h.program})"></span><b>${esc(h.name)}</b>
          <span class="muted"><small> · ${new Date(h.date).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</small></span></span>
          ${changeBadge(h, idx)}</div>
        <div class="body">${sessionBody(h)}</div>
      </div>`).join('')}`;
  $('#pop').hidden = false;
}

function renderStats() {
  const hist = S.history.map((h, idx) => {
    const ed = editHist === h.id;
    const heInput = (k, i, f, v) => `<input type="number" inputmode="${f === 'kg' ? 'decimal' : 'numeric'}" min="0" placeholder="${f === 'kg' ? 'kg' : 'reps'}" data-he="${h.id}" data-k="${k}" data-i="${i}" data-f="${f}" value="${v ?? ''}" aria-label="${f === 'kg' ? 'kg used' : 'Reps done'}">`;
    const heRow = (k, x, i, label) => `<div class="he">${heInput(k, i, 'reps', x.reps)}${heInput(k, i, 'kg', x.kg || '')}<span>${label}</span></div>`;
    const x = h.extra;
    const body = ed
      ? `<div class="meta">reps · kg</div>` +
        h.exercises.map((e, i) => heRow('exercises', e, i, `${esc(e.name)}${e.target ? ` <small>(goal ${e.target})</small>` : ''}`)).join('') +
        (h.buyout || []).map((b, i) => heRow('buyout', b, i, `${esc(b.name)} <small>(buy-out)</small>`)).join('')
      : sessionBody(h);
    return `
    <details class="hist"${openHist === h.id ? ' open' : ''}>
      <summary><span class="pill" style="background:var(--${h.program})"></span>
        <span class="when"><b>${esc(h.name)}</b>${x ? ' <span class="xtra">●</span>' : ''}<span class="muted"><small> · ${dateTxt(h.date)}</small></span></span>
        ${changeBadge(h, idx)}</summary>
      <div class="body">${body}</div>
      <button class="edit" data-act="editHist" data-id="${h.id}">${ed ? 'Done' : 'Edit reps'}</button>
      ${ed ? '' : `<button class="del" data-act="del" data-id="${h.id}">Delete</button>`}
    </details>`;
  }).reverse().join('');

  $('#view-stats').innerHTML = `
    <section class="card"><h2>Last 5 weeks</h2>${calendar()}</section>
    ${progressCard()}
    <section class="card"><h2>History</h2>${hist || '<div class="muted">No workouts yet.</div>'}</section>`;
}

// ---------- render: settings ----------
function stepper(pid, list, i, field, val, unit, step) {
  const attrs = `data-act="step" data-p="${pid}" data-l="${list}" data-i="${i}" data-f="${field}"`;
  return `<div class="stp"><button ${attrs} data-d="${-step}" aria-label="decrease">−</button>
    <span>${field === 'kg' && !val ? '–' : +val}<small>${unit}</small></span>
    <button ${attrs} data-d="${step}" aria-label="increase">+</button></div>`;
}

function programCard(pid) {
  const p = S.programs[pid];
  const sessions = sessionsFor(pid);
  const n = (p.nextUp || 0) % (p.exercises.length || 1);
  const ed = editing === pid;
  const nameInput = (list, i, name) => {
    const at = `data-p="${pid}" data-l="${list}" data-i="${i}"`;
    return `<div class="nmrow">
      <input class="nm" value="${esc(name)}" data-rn="${pid}" data-l="${list}" data-i="${i}" aria-label="Exercise name">
      <button class="ib" data-act="move" ${at} data-d="-1" aria-label="Move up"${i === 0 ? ' disabled' : ''}>↑</button>
      <button class="ib" data-act="move" ${at} data-d="1" aria-label="Move down"${i === p[list].length - 1 ? ' disabled' : ''}>↓</button>
      <button class="ib del" data-act="removeEx" ${at} aria-label="Remove">✕</button>
    </div>`;
  };
  // reps/kg steppers only appear after tapping Edit; otherwise just the values
  const rows = p.exercises.map((e, i) => ed ? `
    <div class="erow">
      ${nameInput('exercises', i, e.name)}
      <div class="steppers">${stepper(pid, 'exercises', i, 'reps', e.reps, 'reps', 1)}${stepper(pid, 'exercises', i, 'kg', e.kg, 'kg', 2.5)}</div>
    </div>` : `
    <div class="erow row">
      <button class="ename" style="padding:0" data-act="setNext" data-p="${pid}" data-i="${i}">${esc(e.name)}${i === n ? '<span class="up">↑ +1 next</span>' : ''}</button>
      <span class="muted" style="white-space:nowrap">${e.reps} reps${e.kg ? ` · ${+e.kg} kg` : ''}</span>
    </div>`).join('');
  const bos = p.buyout.map((b, i) => {
    const results = sessions.map(s => (s.buyout || []).find(x => same(x, b))).filter(x => x && x.reps != null);
    const best = results.length ? Math.max(...results.map(r => r.reps)) : null;
    const last = results.length ? results[results.length - 1].reps : null;
    return `
    <div class="erow">
      ${ed ? `${nameInput('buyout', i, b.name)}<div class="steppers">${stepper(pid, 'buyout', i, 'kg', b.kg, 'kg', 2.5)}</div>`
        : `<div class="row"><span class="ename" style="padding:0">${esc(b.name)}</span><span class="muted">${b.kg ? `${+b.kg} kg` : ''}</span></div>`}
      <div class="meta">${best == null ? 'No results yet' : `Last: ${last} reps · Best: ${best} reps`}</div>
    </div>`;
  }).join('');
  return `
    <section class="card" style="border-top:4px solid var(--${pid})">
      <details>
        <summary class="row"><h2 style="margin:0">${esc(p.name)}${pid === 'p3' ? ' <span class="tag">extra</span>' : ''} <span class="chev">›</span></h2><span class="muted"><small>done ${sessions.length}×</small></span></summary>
        <div class="row">
          <div class="meta">${ed ? 'Change reps and kg, rename, reorder, add or remove, then tap Done.'
            : 'Tap an exercise to choose which one gets +1 rep next. Tap Edit to change reps, kg or names.'}</div>
          <button class="btn" style="padding:8px 14px;flex:none" data-act="editNames" data-p="${pid}">${ed ? 'Done' : 'Edit'}</button>
        </div>
        ${rows}
        ${ed ? `<button class="btn block" data-act="addEx" data-p="${pid}" data-l="exercises">+ Add exercise</button>` : ''}
        ${p.buyout.length || (ed && pid !== 'p3') ? `<div class="sub">Buy-out</div>${bos}` : ''}
        ${ed && pid !== 'p3' ? `<button class="btn block" data-act="addEx" data-p="${pid}" data-l="buyout">+ Add buy-out</button>` : ''}
      </details>
    </section>`;
}

function renderSettings() {
  const cur = ensureActive().program;
  $('#view-settings').innerHTML = `
    <section class="card">
      <h2>Today's program</h2>
      <div class="segs" style="margin:0">${MAIN.map(k =>
        `<button class="seg${k === cur ? ' on' : ''}" style="--pc:var(--${k})" data-act="setProgram" data-p="${k}">${esc(S.programs[k].name)}</button>`).join('')}</div>
      <div class="meta">Switches automatically after each workout.</div>
    </section>
    <section class="card row">
      <span>Round time</span>
      <div class="stp"><button data-act="roundMin" data-d="-0.5" aria-label="decrease">−</button>
        <span>${S.roundMin || 6}<small>min</small></span>
        <button data-act="roundMin" data-d="0.5" aria-label="increase">+</button></div>
    </section>
    <section class="card row">
      <div>Sound<div class="meta" style="margin-top:2px">Beeps at the end of each round.</div></div>
      <button class="tgl${S.sound ? ' on' : ''}" data-act="sound" role="switch" aria-checked="${!!S.sound}" aria-label="Sound"><i></i></button>
    </section>
    <section class="card row">
      <div>Vibration<div class="meta" style="margin-top:2px">Vibrates at the end of each round.</div></div>
      <button class="tgl${S.vibrate ? ' on' : ''}" data-act="vibration" role="switch" aria-checked="${!!S.vibrate}" aria-label="Vibration"><i></i></button>
    </section>
    ${['p1', 'p2', 'p3'].map(programCard).join('')}
    <section class="card">
      <h2>Backup</h2>
      <div class="meta" style="margin-top:0">Your data lives only on this phone. Export now and then to keep a copy.</div>
      <div class="row" style="margin-top:10px">
        <button class="btn" style="flex:1" data-act="export">Export</button>
        <button class="btn" style="flex:1" data-act="import">Import</button>
      </div>
    </section>`;
  // keep the program card that's being edited open across re-renders
  if (editing) document.querySelectorAll('#view-settings details')[['p1', 'p2', 'p3'].indexOf(editing)].open = true;
}

function render() {
  VIEWS.forEach(v => { $('#view-' + v).hidden = tab !== v; });
  document.body.classList.toggle('focus', focus && tab === 'today');
  document.querySelectorAll('.bnav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if (tab === 'today') renderToday();
  else if (tab === 'stats') renderStats();
  else renderSettings();
}

function kgUsed(a, x) {
  const raw = (a.kg || {})[x.id];
  if (raw === undefined) return x.kg;
  const v = parseFloat(String(raw).replace(',', '.'));
  return isNaN(v) ? 0 : v;
}

// ---------- actions ----------
const actions = {
  tab(d) {
    tab = d.t;
    try { localStorage.setItem('wt-tab', tab); } catch (e) {}
    render(); window.scrollTo(0, 0);
  },
  // the timer buttons act on whichever timer is on screen (main program or program 3)
  pause() {
    const a = S.active, { t } = cur(a);
    if (t.runSince) { t.acc += Date.now() - t.runSince; t.runSince = null; syncAwake(); }
    else { ensureAudio(); t.runSince = Date.now(); t.started = true; a.firstStart = a.firstStart || t.runSince; keepAwake(); }
    save(); tick();
  },
  // "+15" counts the clock forward (less time left in the round), "−15" gives 15 s back
  nudge(d) { const { t, len } = cur(S.active); setElapsed(t, elapsed(t) + +d.d, len); save(); tick(); },
  roundPlus() { const { t, len } = cur(S.active); setElapsed(t, elapsed(t) + len, len); save(); tick(); },
  roundMinus() { const { t, len } = cur(S.active); setElapsed(t, elapsed(t) - len, len); save(); tick(); },
  restartRound() { const { t, len } = cur(S.active); const e = elapsed(t); setElapsed(t, e - e % len, len); save(); tick(); },
  // ✓ marks the current round as done early; the clock keeps running to the limit. Tap again to undo.
  markRound() {
    const { t, len } = cur(S.active), onClock = Math.floor(elapsed(t) / len);
    t.marked = (t.marked || 0) > onClock ? onClock : onClock + 1;
    save(); tick();
  },
  // switch the big timer between the main program and program 3 (the main clock stops when you move on)
  mode(d) {
    const a = S.active;
    if (d.m === 'extra' && a.runSince) { a.acc += Date.now() - a.runSince; a.runSince = null; }
    a.mode = d.m;
    save(); syncAwake(); render(); window.scrollTo(0, 0);
  },
  xMin(d) {
    S.extraMin = +d.m;
    const x = S.active && S.active.xt;
    if (x) setElapsed(x, elapsed(x), extraMs()); // re-sync round count: no false alarm when switching
    save(); render();
  },
  finish() {
    const a = S.active, p = S.programs[a.program], p3 = S.programs.p3;
    const rounds = roundsDone(a, roundMs()), xRounds = extraRounds(a);
    if (rounds < TARGET && !confirm(`Only ${rounds} of ${TARGET} rounds completed. Save anyway?`)) return;
    const session = {
      id: uid(), date: new Date(firstStart(a) || Date.now()).toISOString(), program: a.program, name: p.name,
      rounds, durationMs: totalTime(a),
      exercises: p.exercises.map(x => {
        const v = parseInt((a.done || {})[x.id], 10);
        return { id: x.id, name: x.name, reps: isNaN(v) ? x.reps : v, target: x.reps, kg: kgUsed(a, x) };
      }),
      buyout: p.buyout.map(b => {
        const v = parseInt(a.buyout[b.id], 10);
        return { id: b.id, name: b.name, kg: kgUsed(a, b), reps: isNaN(v) ? null : v };
      }),
      extra: a.program !== 'p3' && xRounds ? {
        rounds: xRounds,
        exercises: p3.exercises.map(x => ({ id: x.id, name: x.name, reps: x.reps, target: x.reps, kg: x.kg })),
      } : null,
    };
    // the exercise due for +1 only goes up if all its reps were done; otherwise it gets another try next time
    const nx = p.exercises[(p.nextUp || 0) % (p.exercises.length || 1)];
    const nxDone = nx && session.exercises.find(x => x.id === nx.id);
    const missed = nxDone && nxDone.reps < nxDone.target;
    session.progressed = missed ? null : progress(p);
    if (session.extra) session.extra.progressed = progress(p3);
    S.history.push(session);
    if (MAIN.includes(a.program)) S.nextMain = other(a.program);
    S.active = null;
    save(); releaseAwake(); render();
    toast(missed ? `Saved! ${nx.name} stays at ${nx.reps} reps for next time`
      : session.progressed ? `Saved! ${session.progressed.name} is now ${session.progressed.to} reps` : 'Workout saved!');
  },
  cancel() {
    if (!confirm('Reset this workout? The timer and anything you typed will be cleared.')) return;
    S.active = null; save(); releaseAwake(); render();
  },
  setProgram(d) {
    const a = ensureActive();
    if (a.program === d.p) return;
    if (firstStart(a) && !confirm(`You've started ${S.programs[a.program].name}. Switch and clear it?`)) return;
    S.nextMain = d.p;
    S.active = newActive(d.p);
    save(); releaseAwake(); render();
  },
  step(d) {
    const item = S.programs[d.p][d.l][+d.i];
    const min = d.f === 'reps' ? 1 : 0;
    item[d.f] = Math.max(min, Math.round((item[d.f] + parseFloat(d.d)) * 100) / 100);
    save(); render();
  },
  setNext(d) { S.programs[d.p].nextUp = +d.i; save(); render(); },
  editNames(d) {
    if (editing === d.p) {
      const p = S.programs[d.p];
      [...p.exercises, ...p.buyout].forEach(x => { x.name = x.name.trim() || 'Exercise'; });
      save();
      editing = null;
    } else editing = d.p;
    render();
  },
  move(d) {
    const p = S.programs[d.p];
    keepNext(p, () => {
      const arr = p[d.l], i = +d.i, j = i + +d.d;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
    });
    save(); render();
  },
  removeEx(d) {
    const p = S.programs[d.p], item = p[d.l][+d.i];
    if (!confirm(`Remove "${item.name}"? Its old results stay in your history.`)) return;
    keepNext(p, () => p[d.l].splice(+d.i, 1));
    save(); render();
  },
  addEx(d) {
    S.programs[d.p][d.l].push(ex('Placeholder', d.l === 'buyout' ? 0 : 12));
    save(); render();
  },
  progP(d) { progP = d.p; render(); },
  progRange(d) { progRange = +d.d; render(); },
  sound() {
    S.sound = !S.sound;
    save();
    if (S.sound) { ensureAudio(); beep(880, 0.2); } // short test beep
    render();
  },
  vibration() {
    S.vibrate = !S.vibrate;
    save();
    vibrate(200); // short test buzz
    render();
  },
  roundMin(d) {
    S.roundMin = Math.min(30, Math.max(0.5, (S.roundMin || 6) + parseFloat(d.d)));
    if (S.active) S.active.lastDone = Math.floor(elapsed(S.active) / roundMs()); // no false round alarm
    save(); render();
  },
  editHist(d) { editHist = editHist === d.id ? null : d.id; openHist = d.id; render(); },
  del(d) {
    if (!confirm('Delete this workout from history? (Reps/kg are not changed.)')) return;
    S.history = S.history.filter(h => h.id !== d.id);
    save(); render();
  },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `workouts-${dayKey(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  import() { $('#importFile').click(); },
  focus() {
    focus = !focus;
    try { localStorage.setItem('wt-focus', focus ? '1' : '0'); } catch (e) {}
    render(); window.scrollTo(0, 0);
  },
  day(d) { openDay(d.k); },
  closePop() { $('#pop').hidden = true; },
  noop() {}, // taps inside the pop-up shouldn't close it
};

document.addEventListener('click', ev => {
  if (ev.target.matches('input')) return; // typing in a rep box shouldn't trigger its row
  const b = ev.target.closest('[data-act]');
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b.dataset, b, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target.dataset;
  if (t.bo && S.active) { S.active.buyout[t.bo] = ev.target.value; save(); }
  if (t.done && S.active) {
    (S.active.done = S.active.done || {})[t.done] = ev.target.value;
    ev.target.classList.toggle('miss', ev.target.value !== '' && +ev.target.value < +t.target);
    save();
  }
  if (t.kgdone && S.active) {
    (S.active.kg = S.active.kg || {})[t.kgdone] = ev.target.value;
    ev.target.classList.toggle('miss', ev.target.value !== '' && +ev.target.value < +t.target);
    save();
  }
  if (t.he) {
    const item = S.history.find(h => h.id === t.he)[t.k][+t.i];
    if (t.f === 'kg') {
      const v = parseFloat(ev.target.value.replace(',', '.'));
      item.kg = isNaN(v) ? 0 : v;
    } else {
      const v = parseInt(ev.target.value, 10);
      item.reps = isNaN(v) ? null : v;
    }
    save();
  }
  if (t.rn) { S.programs[t.rn][t.l][+t.i].name = ev.target.value; save(); }
});

// chart readout: hover (or tap) shows the nearest workout's value
function chartPoint(ev) {
  const svg = ev.target.closest && ev.target.closest('svg.chart');
  const pts = svg && charts[svg.dataset.key];
  if (!pts) return;
  const r = svg.getBoundingClientRect();
  const vx = (ev.clientX - r.left) / r.width * svg.viewBox.baseVal.width;
  const best = pts.reduce((b, p) => Math.abs(p.x - vx) < Math.abs(b.x - vx) ? p : b);
  const xh = svg.querySelector('.xh'), hl = svg.querySelector('.hl');
  xh.setAttribute('x1', best.x); xh.setAttribute('x2', best.x);
  hl.setAttribute('cx', best.x); hl.setAttribute('cy', best.y);
  $('#cv-' + svg.dataset.key).textContent = best.text;
}
function chartLeave(ev) {
  if (ev.pointerType === 'touch' || !ev.target.matches || !ev.target.matches('svg.chart')) return; // taps keep their readout
  const svg = ev.target;
  svg.querySelector('.xh').setAttribute('x1', -20); svg.querySelector('.xh').setAttribute('x2', -20);
  svg.querySelector('.hl').setAttribute('cx', -20);
  const cv = $('#cv-' + svg.dataset.key);
  cv.textContent = cv.dataset.def;
}
// remember whether the program 3 card is folded out across re-renders ('toggle' doesn't bubble: capture it)
document.addEventListener('toggle', ev => { if (ev.target.id === 'x-card') xOpen = ev.target.open; }, true);
document.addEventListener('pointermove', chartPoint);
document.addEventListener('pointerdown', chartPoint);
document.addEventListener('pointerleave', chartLeave, true);

$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.programs || !Array.isArray(data.history)) throw new Error();
    if (!confirm(`Replace all current data with this backup (${data.history.length} workouts)?`)) return;
    S = migrate(data); save(); render(); toast('Backup imported');
  } catch (e) { alert('That file is not a valid backup.'); }
});

if (anyRunning()) keepAwake();
render();

// ask the browser not to evict our data when the phone is low on space
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
